<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الليغا - جاري التحميل</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #101010; color: white;
            font-family: Tahoma, Arial, sans-serif; display: flex;
            justify-content: center; align-items: center; height: 100vh; text-align: center;
        }
        .container {
            background: #1c1c1c; padding: 40px 20px; border-radius: 15px;
            border: 1px solid #333; max-width: 90%; width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { color: #ff263f; margin-bottom: 10px; }
        p { font-size: 18px; color: #aaa; margin-bottom: 30px; }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1); width: 50px; height: 50px;
            border-radius: 50%; border-left-color: #ff263f;
            animation: spin 1s linear infinite; margin: 0 auto 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .timer { font-size: 24px; color: #fff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>دوري الليغا</h1>
        <p>جاري تجهيز الموقع، يرجى الانتظار...</p>
        <div class="spinner"></div>
        <p class="timer" id="timer">60</p>
    </div>
    <script>
        const targetUrl = 'https://liga-b97dd.containers.snapdeploy.app/';
        let secondsLeft = 60;
        let isReady = false;
        const timerEl = document.getElementById('timer');

        const countdown = setInterval(() => {
            if (secondsLeft > 0) { secondsLeft--; timerEl.innerText = secondsLeft; }
        }, 1000);

        const wakeUp = setInterval(async () => {
            try {
                await fetch(targetUrl, { mode: 'no-cors', cache: 'no-store' });
                isReady = true;
            } catch (e) {}
        }, 3000);

        const checkReady = setInterval(() => {
            if (isReady) {
                clearInterval(countdown); clearInterval(wakeUp); clearInterval(checkReady);
                window.location.href = targetUrl;
            }
        }, 1000);

        setTimeout(() => { window.location.href = targetUrl; }, 65000);
    </script>
</body>
</html>
